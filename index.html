<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <script>
      (function () {
        const login = 'https://www.prudle-education.com/log-in-out';
        const prodHosts = ['www.prudle-education.com', 'prudle-education.com', 'abbassaboali-alt.github.io'];
        const currentHost = location.hostname.toLowerCase();
        
        // Prevent accidental save shortcuts
        window.addEventListener(
          'keydown',
          (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
              e.preventDefault();
            }
          },
          { capture: true }
        );

        // Host security guard for production domains
        const isProdDomain = prodHosts.includes(currentHost);
        const isDevHost = currentHost === 'localhost' || currentHost === '127.0.0.1' || currentHost.endsWith('.run.app') || currentHost.endsWith('.webcontainer.io');

        if (!isDevHost && (!isProdDomain || location.protocol !== 'https:')) {
          location.replace(login);
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prudle – Executive Courses Report</title>
    <meta name="description" content="Executive courses report dashboard with bilingual English/Arabic interface, real-time Cloudflare Worker data integration, inline course editing, period groupings, executive summary, and PDF export." />

    <meta property="og:description" content="Executive courses report dashboard with bilingual English/Arabic interface, real-time Cloudflare Worker data integration, inline course editing, period groupings, executive summary, and PDF export." />

    <!-- Font Awesome 6.5.0 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />

    <link rel="stylesheet" crossorigin href="./assets/index-DkWtPABq.css">
  </head>
  <body>
    <style>
      #prudle-boot{position:fixed;inset:0;z-index:1000;background:#eef2f7;color:#0f3057;font-family:Arial,Tahoma,sans-serif;display:flex;align-items:center;justify-content:center;transition:opacity .18s ease;}
      #prudle-boot .boot-card{width:min(420px,90vw);background:#fff;border-radius:18px;padding:30px 24px;text-align:center;box-shadow:0 8px 32px #0f305719}
      #prudle-boot .boot-title{font-size:24px;font-weight:800;margin-bottom:10px}
      #prudle-boot .boot-subtitle{font-size:14px;color:#52657d;margin-top:12px}
      #prudle-boot .boot-track{height:5px;background:#e4eaf2;border-radius:9px;overflow:hidden;margin-top:24px}
      #prudle-boot .boot-bar{height:100%;width:35%;background:#164478;border-radius:9px;animation:prudle-progress 1.2s ease-in-out infinite alternate}
      @keyframes prudle-progress{from{transform:translateX(-95%)}to{transform:translateX(280%)}}
      @media(prefers-reduced-motion:reduce){#prudle-boot .boot-bar{animation:none;width:100%}}
    </style>
    <div id="prudle-boot" role="status" aria-live="polite">
      <div class="boot-card"><div class="boot-title">PRUDLE</div><div>Executive Courses Report</div><div class="boot-track"><div class="boot-bar"></div></div><div class="boot-subtitle">Loading dashboard… | جارٍ تحميل لوحة التقارير…</div></div>
    </div>
    <div id="root"></div>
    <script>
      (function(){
        var root=document.getElementById('root');
        var boot=document.getElementById('prudle-boot');
        var observer=new MutationObserver(function(){
          if(root.childElementCount>0){
            observer.disconnect();
            boot.style.opacity='0';
            boot.style.pointerEvents='none';
            setTimeout(function(){boot.remove()},220);
          }
        });
        observer.observe(root,{childList:true});
        if(root.childElementCount>0){observer.disconnect();boot.remove();}
      })();
    </script>
  </body>
</html>
