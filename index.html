    <!-- PRUDLE HOST GUARD + CTRL+S DETERRENT -->
    <script>
      (function () {
        'use strict';
        const LOGIN_URL = 'https://www.prudle-education.com/log-in-out';
        const ALLOWED_HOSTS = new Set([
          'www.prudle-education.com',
          'prudle-education.com',
          'abbassaboali-alt.github.io'
        ]);

        // Intercept Ctrl+S / Cmd+S casual-copy deterrent
        window.addEventListener('keydown', function (event) {
          if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 's') {
            event.preventDefault();
          }
        }, { capture: true });

        const hostname = location.hostname.toLowerCase();
        const isDev = hostname === 'localhost' ||
          hostname === '127.0.0.1' ||
          hostname.endsWith('.run.app') ||
          hostname.endsWith('.aistudio.google.com') ||
          hostname === '';

        if (isDev) return; // Allow development environments

        const allowed = location.protocol === 'https:' && ALLOWED_HOSTS.has(hostname);
        if (allowed) return;

        window.stop();
        try { document.documentElement.innerHTML = ''; } catch (_) {}
        window.location.replace(LOGIN_URL);
      })();
    </script>
