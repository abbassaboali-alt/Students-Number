    <!-- Direct Pre-Render Host and Session Gate -->
    <script>
      (function () {
        "use strict";
        const LOGIN = "https://www.prudle-education.com/log-in-out";
        const HOSTS = new Set([
          "www.prudle-education.com",
          "prudle-education.com",
          "abbassaboali-alt.github.io"
        ]);

        window.addEventListener("keydown", function (e) {
          if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") {
            e.preventDefault();
          }
        }, true);

        const host = window.location.hostname.toLowerCase();
        const isLocalHost = host === "localhost" || host === "127.0.0.1";

        if (!isLocalHost) {
          if (window.location.protocol !== "https:" || !HOSTS.has(host)) {
            try { window.stop(); } catch (_) {}
            window.location.replace(LOGIN);
            return;
          }
        }

        const token = sessionStorage.getItem("firebaseToken") || localStorage.getItem("firebaseToken");
        const uid = sessionStorage.getItem("firebaseUid") || localStorage.getItem("firebaseUid");
        const rawStart = sessionStorage.getItem("prudleDeviceSessionStartedAt") || localStorage.getItem("prudleDeviceSessionStartedAt");
        let started = 0;
        if (rawStart) {
          const num = Number(rawStart);
          if (!isNaN(num) && num > 0) {
            started = num < 1e11 ? num * 1000 : num;
          } else {
            const dt = Date.parse(rawStart);
            if (!isNaN(dt)) started = dt;
          }
        }
        const expired = started > 0 && (Date.now() - started >= 86400000);
        if (!token || !uid || expired) {
          try { window.stop(); } catch (_) {}
          window.location.replace(LOGIN);
          return;
        }
      })();
    </script>
