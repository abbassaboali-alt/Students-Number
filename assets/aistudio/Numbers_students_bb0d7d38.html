<script>
(function () {
  'use strict';
  const LOGIN_URL = 'https://www.prudle-education.com/log-in-out';
  const ALLOWED_HOSTS = new Set([
    'www.prudle-education.com',
    'prudle-education.com',
    'abbassaboali-alt.github.io'
  ]);
  window.addEventListener('keydown', function (event) {
    if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 's') {
      event.preventDefault();
    }
  }, { capture: true });
  const allowed = location.protocol === 'https:' &&
    ALLOWED_HOSTS.has(location.hostname.toLowerCase());
  if (allowed) return;
  window.stop();
  try { document.documentElement.innerHTML = ''; } catch (_) {}
  window.location.replace(LOGIN_URL);
})();
</script>

<script>
/* ============================================================
   PRUDLE SHARED AUTH SERVICE (single instance per page)
   - All data access goes through the Prudle Cloudflare Worker.
   - Routes used (all present in the supplied Worker source):
       POST /db            (Authorization: Bearer <idToken>)
       GET  /auth/session  (only if a server session credential exists)
       POST /auth/refresh  (only if refresh + session credentials exist)
       POST /auth/logout   (best effort)
   - Browser timestamps/localStorage role are UI hints only; the Worker
     (and Firestore rules via the caller's ID token) authorize every request.
   ============================================================ */
(function(){
'use strict';
if (window.PrudleAuth) return;

var WORKER_BASE = 'https://api-prudle.abbassaboali.workers.dev';
var LOGIN_URL   = 'https://www.prudle-education.com/log-in-out';
var REQUEST_TIMEOUT_MS = 20000;
var REFRESH_SKEW_MS    = 5 * 60 * 1000;

/* ---- Credential keys the login page may have written.
        UNVERIFIED: the production login source was NOT supplied.
        The first key of each list is the legacy name from the migration spec;
        extra names are optional fallbacks. A missing optional key never causes logout
        by itself (missing ID token / username / role does, as in the original page). */
var ID_TOKEN_KEYS = ['firebaseToken', 'idToken'];
var REFRESH_KEYS  = ['firebaseRefreshToken', 'refreshToken'];
var SESSION_KEYS  = ['prudleSessionToken', 'sessionToken', 'PRUDLE_SESSION_TOKEN'];
var EXPIRY_KEYS   = ['prudleSessionExpiresAt', 'sessionExpiresAt'];
var UID_KEYS      = ['firebaseUid'];
var LEGACY_KEYS   = ['username', 'role', 'roles', 'loginDate'];
var APP_KEYS = [].concat(ID_TOKEN_KEYS, REFRESH_KEYS, SESSION_KEYS, EXPIRY_KEYS, UID_KEYS, LEGACY_KEYS);

var redirecting = false;
var serverExpiresAt = 0;      /* in-memory hint from GET /auth/session only */
var refreshInflight = null;
var watchersStarted = false;
var deadlineTimer = null;
var channel = null;
try { channel = new BroadcastChannel('prudle-auth'); } catch (e) {}

/* ---------- errors ---------- */
function PErr(code, message, kind, extra) {
  var e = new Error(message || code);
  e.code = code;
  e.kind = kind || 'FATAL';   /* AUTH | FORBIDDEN | RETRYABLE | FATAL | CANCELLED */
  if (extra) for (var k in extra) e[k] = extra[k];
  return e;
}

/* ---------- storage helpers (app-owned keys only) ---------- */
function stores() {
  var a = [];
  try { a.push(window.sessionStorage); } catch (e) {}
  try { a.push(window.localStorage); } catch (e) {}
  return a;
}
function findKey(keys) {
  var s = stores();
  for (var i = 0; i < s.length; i++) {
    for (var j = 0; j < keys.length; j++) {
      var v = null;
      try { v = s[i].getItem(keys[j]); } catch (e) {}
      if (v) return { store: s[i], key: keys[j], value: v };
    }
  }
  return { store: null, key: null, value: '' };
}
function writeEverywhere(keys, value) {
  /* Update only stores/keys that already hold a credential, so a newer value
     reaches every tab and no new storage location is introduced. */
  var s = stores();
  for (var i = 0; i < s.length; i++) {
    for (var j = 0; j < keys.length; j++) {
      try { if (s[i].getItem(keys[j]) !== null) s[i].setItem(keys[j], value); } catch (e) {}
    }
  }
}
function removeAppKeys() {
  var s = stores();
  for (var i = 0; i < s.length; i++) {
    for (var j = 0; j < APP_KEYS.length; j++) {
      try { s[i].removeItem(APP_KEYS[j]); } catch (e) {}
    }
  }
}
function jwtExp(t) {            /* HINT ONLY — not token validation */
  try {
    var p = String(t).split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
    while (p.length % 4) p += '=';
    var o = JSON.parse(atob(p));
    return o && o.exp ? o.exp * 1000 : 0;
  } catch (e) { return 0; }
}
function parseTime(v) {         /* seconds, milliseconds or ISO */
  if (v === null || v === undefined || v === '') return 0;
  var n = Number(v);
  if (isFinite(n) && n > 0) return n < 1e12 ? n * 1000 : n;
  var d = Date.parse(v);
  return isFinite(d) ? d : 0;
}
function validSession() {
  var v = findKey(SESSION_KEYS).value;
  return /^[a-f0-9]{64}$/.test(v) ? v : '';
}
function expiryAt() {
  return parseTime(findKey(EXPIRY_KEYS).value) || serverExpiresAt || 0;
}
function sessionAlive() {
  var ex = expiryAt();
  return !(ex && Date.now() >= ex);
}

/* ---------- redirect / invalidate ---------- */
function redirectToLogin() {
  if (redirecting) return;
  redirecting = true;
  try { window.location.replace(LOGIN_URL); } catch (e) {}
}
function invalidate(broadcast) {
  removeAppKeys();
  if (deadlineTimer) { clearTimeout(deadlineTimer); deadlineTimer = null; }
  if (broadcast !== false && channel) { try { channel.postMessage({ type: 'logout' }); } catch (e) {} }
  redirectToLogin();
}

/* ---------- synchronous legacy gate (same checks as the original page,
              minus the daily loginDate rule and without wiping unrelated storage) ---------- */
function quickCheck() {
  if (!findKey(['username']).value || !findKey(['role']).value) { invalidate(); return false; }
  if (!findKey(ID_TOKEN_KEYS).value) { invalidate(); return false; }
  if (!sessionAlive()) { invalidate(); return false; }
  return true;
}

/* ---------- network ---------- */
function timedFetch(url, opts, ms, outerSignal) {
  var ctl = new AbortController();
  var timedOut = false;
  var to = setTimeout(function () { timedOut = true; ctl.abort(); }, ms || REQUEST_TIMEOUT_MS);
  if (outerSignal) {
    if (outerSignal.aborted) ctl.abort();
    else outerSignal.addEventListener('abort', function () { ctl.abort(); }, { once: true });
  }
  opts.signal = ctl.signal;
  return fetch(url, opts).then(function (r) { clearTimeout(to); return r; }, function () {
    clearTimeout(to);
    if (outerSignal && outerSignal.aborted) throw PErr('CANCELLED', 'Cancelled', 'CANCELLED');
    if (timedOut) throw PErr('TIMEOUT', 'The server took too long to respond', 'RETRYABLE');
    throw PErr('NETWORK', 'Network error', 'RETRYABLE');
  });
}

function classify(status, data) {
  var code = (data && data.code) || '';
  var msg  = (data && data.error) || '';
  var m = /failed \((\d{3})\)/.exec(msg);       /* Worker wraps Firestore errors in HTTP 500 */
  var inner = m ? Number(m[1]) : 0;
  if (code === 'SESSION_EXPIRED' || code === 'SESSION_REQUIRED' || code === 'SESSION_USER_MISMATCH') {
    return PErr(code, 'Session expired. Please sign in again.', 'AUTH');
  }
  if (status === 401 || inner === 401) {
    /* Rejected before any operation executed -> safe to refresh and retry once. */
    return PErr(code || 'UNAUTHORIZED', 'Authentication required', 'AUTH', { refreshable: true });
  }
  if (status === 403 || inner === 403) return PErr(code || 'FORBIDDEN', 'Access denied', 'FORBIDDEN');
  if (status === 429 || status >= 500 || !data) {
    return PErr(code || 'UNAVAILABLE', 'Service temporarily unavailable', 'RETRYABLE', { status: status });
  }
  return PErr(code || 'REQUEST_FAILED', msg || 'Request failed', 'FATAL', { status: status });
}

/* ---------- ID token refresh (single flight, cross-tab lock when available) ---------- */
function doRefresh() {
  if (refreshInflight) return refreshInflight;
  var before = findKey(ID_TOKEN_KEYS).value;
  var run = async function () {
    var cur = findKey(ID_TOKEN_KEYS).value;
    if (cur && cur !== before && jwtExp(cur) - Date.now() > REFRESH_SKEW_MS) return cur;  /* another tab refreshed */
    var rt = findKey(REFRESH_KEYS).value, ses = validSession();
    if (!rt || !ses) throw PErr('REFRESH_UNAVAILABLE', 'No refresh credential', 'FATAL');
    var res = await timedFetch(WORKER_BASE + '/auth/refresh', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Prudle-Session': ses },
      body: JSON.stringify({ refreshToken: rt }),
      cache: 'no-store'
    });
    var data = null;
    try { data = await res.json(); } catch (e) {}
    if (res.ok && data && data.success === true && data.idToken) {
      var uid = findKey(UID_KEYS).value;
      if (uid && data.localId && uid !== data.localId) throw PErr('SESSION_USER_MISMATCH', 'Identity mismatch', 'AUTH');
      var latest = findKey(ID_TOKEN_KEYS).value;
      if (!latest || jwtExp(data.idToken) >= jwtExp(latest)) {     /* never overwrite a newer token */
        writeEverywhere(ID_TOKEN_KEYS, data.idToken);
        if (data.refreshToken) writeEverywhere(REFRESH_KEYS, data.refreshToken);
      }
      return data.idToken;
    }
    if (res.status === 401 || res.status === 403) throw PErr('REFRESH_REJECTED', 'Session expired', 'AUTH');
    throw classify(res.status, data);
  };
  var p = (navigator.locks && navigator.locks.request)
    ? navigator.locks.request('prudle-auth-refresh', run)
    : run();
  refreshInflight = Promise.resolve(p).then(function (v) { refreshInflight = null; return v; },
                                             function (e) { refreshInflight = null; throw e; });
  return refreshInflight;
}

async function getIdToken(force) {
  if (!sessionAlive()) { invalidate(); throw PErr('SESSION_EXPIRED', 'Session expired', 'AUTH'); }
  var tok = findKey(ID_TOKEN_KEYS).value;
  if (!tok) { invalidate(); throw PErr('NO_SESSION', 'No session', 'AUTH'); }
  var exp = jwtExp(tok);
  var needs = force || (exp && exp - Date.now() < REFRESH_SKEW_MS);
  if (!needs) return tok;
  try { return await doRefresh(); }
  catch (e) {
    if (e.code === 'REFRESH_UNAVAILABLE') {
      if (force || (exp && exp <= Date.now() + 5000)) { invalidate(); throw PErr('SESSION_EXPIRED', 'Session expired', 'AUTH'); }
      return tok;                                     /* still valid; nothing to refresh with */
    }
    if (e.kind === 'AUTH') { invalidate(); throw e; }
    if (!force && exp > Date.now() + 5000) return tok; /* transient refresh failure, token still valid */
    throw e;
  }
}

/* Authenticated Worker request. One authorized refresh + one retry ONLY when the request
   was rejected for authentication before executing. No automatic replay otherwise. */
async function request(path, opts) {
  opts = opts || {};
  var token = await getIdToken(false);
  var headers = { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token };
  var ses = validSession();
  if (ses) headers['X-Prudle-Session'] = ses;
  var res = await timedFetch(WORKER_BASE + path, {
    method: opts.method || 'POST',
    headers: headers,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
    cache: 'no-store'
  }, opts.timeout, opts.signal);
  var data = null;
  try { data = await res.json(); } catch (e) {}
  if (res.ok && data && data.success === true) return data;
  var err = classify(res.status, data);
  if (err.refreshable && !opts.retriedAuth) {
    await getIdToken(true);
    return request(path, { method: opts.method, body: opts.body, timeout: opts.timeout, signal: opts.signal, retriedAuth: true });
  }
  if (err.kind === 'AUTH') invalidate();
  throw err;
}

/* ---------- gate UI (non-sensitive messages only) ---------- */
function gateEl() {
  var g = document.getElementById('prudleAuthGate');
  if (g) return g;
  g = document.createElement('div');
  g.id = 'prudleAuthGate';
  g.setAttribute('dir', 'ltr');
  g.style.cssText = 'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#eef2f7;z-index:2147483647;font-family:Tajawal,sans-serif';
  g.innerHTML = '<div style="background:#fff;padding:28px 34px;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.12);text-align:center;font-weight:800;color:#0f3057;max-width:420px">' +
    '<div id="prudleGateMsg"></div>' +
    '<button id="prudleGateRetry" style="display:none;margin-top:16px;background:#0f3057;color:#fff;border:none;border-radius:10px;padding:10px 22px;font-weight:900;cursor:pointer">Retry</button></div>';
  (document.body || document.documentElement).appendChild(g);
  return g;
}
function gate(msg, retryFn) {
  var g = gateEl();
  g.style.display = 'flex';
  document.getElementById('prudleGateMsg').textContent = msg;
  var b = document.getElementById('prudleGateRetry');
  b.style.display = retryFn ? 'inline-block' : 'none';
  b.onclick = retryFn ? function () { retryFn(); } : null;
}
function reveal() {
  var g = document.getElementById('prudleAuthGate');
  if (g) g.remove();
  document.documentElement.classList.remove('prudle-pending');
}
function fail(e, retryFn) {
  if (!e || e.kind === 'AUTH' || e.code === 'REDIRECTED' || e.kind === 'CANCELLED') return;
  if (e.kind === 'FORBIDDEN') { gate('Access denied. You do not have permission to view this page.', null); return; }
  var msg = e.code === 'BACKEND_PAGINATION_REQUIRED'
    ? 'The server does not support complete paged results (BACKEND_PAGINATION_REQUIRED). Data was not loaded.'
    : 'Connection problem. Please check your network and retry.';
  gate(msg, retryFn);
}

/* ---------- watchers (created once) ---------- */
function armDeadline() {
  if (deadlineTimer) { clearTimeout(deadlineTimer); deadlineTimer = null; }
  var ex = expiryAt();
  if (!ex) return;
  var ms = Math.min(Math.max(ex - Date.now(), 0), 2147483000);
  deadlineTimer = setTimeout(function () { if (!sessionAlive()) invalidate(); else armDeadline(); }, ms);
}
function startWatchers() {
  if (watchersStarted) return;
  watchersStarted = true;
  armDeadline();
  setInterval(function () { if (!sessionAlive()) invalidate(); }, 60000);
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && !sessionAlive()) invalidate();
  });
  window.addEventListener('storage', function (e) {
    if (e.key === null || ID_TOKEN_KEYS.indexOf(e.key) >= 0 || SESSION_KEYS.indexOf(e.key) >= 0) {
      if (!findKey(ID_TOKEN_KEYS).value) invalidate(false);
    }
  });
  if (channel) channel.onmessage = function (m) {
    if (m && m.data && m.data.type === 'logout') invalidate(false);
  };
}

/* ---------- bootstrap ---------- */
async function bootstrap() {
  if (window.top === window.self && location.hostname.toLowerCase() === 'prudle-education.com') {
    redirecting = true;   /* canonical origin: credentials live on www */
    location.replace('https://www.prudle-education.com' + location.pathname + location.search + location.hash);
    throw PErr('REDIRECTED', 'Redirecting', 'AUTH');
  }
  if (!quickCheck()) throw PErr('REDIRECTED', 'No session', 'AUTH');
  if (findKey(['role']).value !== 'admin') {        /* original admin-only UI gate (NOT authorization) */
    redirectToLogin();
    throw PErr('REDIRECTED', 'Not admin', 'AUTH');
  }
  startWatchers();
  gate('Loading…', null);
  var ses = validSession();
  if (ses) {                                        /* server-side 24h session check, when a session credential exists */
    try {
      var s = await request('/auth/session', { method: 'GET' });
      if (typeof s.expiresAt === 'number') serverExpiresAt = s.expiresAt;
      var uid = findKey(UID_KEYS).value;
      if (uid && s.uid && uid !== s.uid) { invalidate(); throw PErr('SESSION_USER_MISMATCH', 'Identity mismatch', 'AUTH'); }
      armDeadline();
    } catch (e) {
      if (e.code === 'REQUEST_FAILED' && e.status === 404) { /* route absent on deployed Worker: UNVERIFIED, continue */ }
      else throw e;
    }
  }
  return true;
}

async function logout() {
  var tok = findKey(ID_TOKEN_KEYS).value, ses = validSession();
  if (channel) { try { channel.postMessage({ type: 'logout' }); } catch (e) {} }
  removeAppKeys();
  if (ses && tok) {
    try {
      await timedFetch(WORKER_BASE + '/auth/logout', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + tok, 'X-Prudle-Session': ses },
        keepalive: true, cache: 'no-store'
      }, 4000);
    } catch (e) {}
  }
  redirectToLogin();
}

window.PrudleAuth = { bootstrap: bootstrap, request: request, gate: gate, reveal: reveal, fail: fail, logout: logout, quickCheck: quickCheck };
window.logout = function () { return logout(); };

window.addEventListener('pageshow', function () { quickCheck(); });
quickCheck();   /* same early protection as the original inline guard */
})();
</script>

<script>
/* ================= WORKER DATA LAYER (replaces direct Firestore SDK) =================
   Contract verified against the supplied Worker source (POST /db):
     {action:"query",collection,filters,orderBy,limit,paginate:true,cursor}
        -> {success:true,data:{documents,count,hasMore,nextCursor}}   (offset cursor "o:<n>", max 500/page)
     {action:"updateDoc",path,data} -> {success:true,data:{updated:true,...}}
   Timestamps arrive as {__type:"timestamp",value:ISO}; converted to {seconds} so the
   original date/sort code keeps working unchanged. */
function normalizeValue(v){
  if(Array.isArray(v)) return v.map(normalizeValue);
  if(v && typeof v === "object"){
    if(v.__type === "timestamp"){
      const ms = Date.parse(v.value);
      return isNaN(ms) ? null : { seconds: Math.floor(ms/1000), nanoseconds: 0 };
    }
    const o = {};
    for(const k of Object.keys(v)) o[k] = normalizeValue(v[k]);
    return o;
  }
  return v;
}
function normalizeDoc(d){
  const o = normalizeValue(d);
  delete o.__path;
  return o;
}
const sleep = (ms)=>new Promise(r=>setTimeout(r,ms));
async function withReadRetry(fn, signal){
  let attempt = 0;
  for(;;){
    try{ return await fn(); }
    catch(e){
      if(e.kind !== "RETRYABLE" || attempt >= 2 || (signal && signal.aborted)) throw e;
      await sleep(600 * Math.pow(2, attempt++));
    }
  }
}
const PrudleDB = {
  /* Reads EVERY page until the Worker explicitly says hasMore === false. */
  async queryAll(collection, opts){
    opts = opts || {};
    const signal = opts.signal;
    const seenCursors = new Set();
    const byPath = new Map();
    let cursor = null;
    for(;;){
      if(signal && signal.aborted) throw Object.assign(new Error("Cancelled"), {code:"CANCELLED", kind:"CANCELLED"});
      const body = {action:"query", collection, filters:opts.filters||[], orderBy:opts.orderBy||[], limit:500, paginate:true};
      if(cursor) body.cursor = cursor;
      const r = await withReadRetry(()=>PrudleAuth.request("/db", {body, signal}), signal);
      const d = r && r.data;
      if(!d || !Array.isArray(d.documents)){
        throw Object.assign(new Error("Malformed response"), {code:"MALFORMED", kind:"RETRYABLE"});
      }
      if(typeof d.hasMore !== "boolean"){
        throw Object.assign(new Error("Worker does not report pagination state"), {code:"BACKEND_PAGINATION_REQUIRED", kind:"FATAL"});
      }
      const fresh = [];
      for(const raw of d.documents){
        const doc = normalizeDoc(raw);
        const key = raw.__path || doc.id;
        if(!byPath.has(key)){ byPath.set(key, doc); fresh.push(doc); }
      }
      if(opts.onPage) opts.onPage(fresh, byPath.size);
      if(!d.hasMore) return {documents:Array.from(byPath.values()), complete:true};
      if(!d.nextCursor || seenCursors.has(d.nextCursor) || d.documents.length === 0){
        throw Object.assign(new Error("Pagination did not advance"), {code:"PAGINATION_STALLED", kind:"FATAL"});
      }
      seenCursors.add(d.nextCursor);
      cursor = d.nextCursor;
    }
  },
  async updateDoc(path, data){
    const r = await PrudleAuth.request("/db", {body:{action:"updateDoc", path, data}});
    return r.data;
  }
};

/* ================= LOGO (TOP + WATERMARK) =================
   ملاحظة: إذا واجهت CORS مع الرابط، استبدله بـ Base64 DataURL (PNG) وستعمل 100%.
*/
const LOGO_URL = "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRlEGHcXcelOlihtrBLFCmjumIyuBxqyoWEZM8DgDpBVg&s";
let LOGO_DATA_URL = null;

/* تحميل الشعار مرة واحدة (مع fallback) */
function loadLogo(){
  return new Promise((resolve)=>{
    if(LOGO_DATA_URL) return resolve(LOGO_DATA_URL);

    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = ()=>{
      try{
        const c = document.createElement("canvas");
        c.width = img.naturalWidth || 600;
        c.height = img.naturalHeight || 300;
        const ctx = c.getContext("2d");
        ctx.drawImage(img,0,0);
        LOGO_DATA_URL = c.toDataURL("image/png");
        resolve(LOGO_DATA_URL);
      }catch(e){
        resolve(null);
      }
    };
    img.onerror = ()=>resolve(null);
    img.src = LOGO_URL;
  });
}

/* ================= DATA ================= */
let COURSES = [];
let STUDENT_COUNT = {};
let FILTERED = [];
let SORT = { key: null, dir: 1 };
let ACTIVE_MODE = false;
 // dir 1 asc, -1 desc

/* تحسينات الأداء */
let renderTimer = null;
let DATE_CACHE = [];
let FILTERS_SIGNATURE = "";

/* ================= HELPERS ================= */
function formatDate(d){
  if(!d) return "-";
  try{
    const dt = (d.seconds) ? new Date(d.seconds*1000) : new Date(d);
    if(isNaN(dt.getTime())) return "-";
    return dt.toISOString().split("T")[0];
  }catch(e){
    return "-";
  }
}
function uniq(arr){
  return [...new Set((arr||[]).filter(v=>v!==undefined && v!==null && (""+v).trim()!==""))];
}
function safeStr(v){
  return (v===undefined || v===null) ? "" : (""+v);
}
function normalizeSortVal(v){
  if(v===undefined || v===null) return "";
  if(v && typeof v === "object" && v.seconds) return v.seconds;
  return (""+v).toLowerCase();
}
function iconFor(dir){ return dir===1 ? "fa fa-sort-up" : "fa fa-sort-down"; }

function getFiltersSignature(){
  const branches = uniq(COURSES.map(x=>safeStr(x.Branch))).sort().join("|");
  const trainers = uniq(COURSES.map(x=>safeStr(x.Trainer))).sort().join("|");
  const courses  = uniq(COURSES.map(x=>safeStr(x.TrainingCourse))).sort().join("|");
  const periods  = uniq(COURSES.map(x=>safeStr(x.Period))).sort().join("|");
  const dates    = uniq(COURSES.map(x=>formatDate(x.StartingDate))).sort().join("|");
  return [branches, trainers, courses, periods, dates].join("###");
}

/* ================= AUTO SAVE (DEBOUNCE) ================= */
const saveTimers = {};
const saveChains = {};
function showSaving(flag){
  const el = document.getElementById("savingHint");
  if(!el) return;
  el.style.display = flag ? "block" : "none";
}
function autoSave(courseId, field, value){
  const key = courseId + "_" + field;
  if(saveTimers[key]) clearTimeout(saveTimers[key]);
  showSaving(true);
  saveTimers[key] = setTimeout(()=>{
    /* Serialize writes per field so an older slow request can never land after a newer one. */
    saveChains[key] = (saveChains[key] || Promise.resolve()).then(async ()=>{
      try{
        await PrudleDB.updateDoc("Courses/" + courseId, { [field]: value });
        /* Server confirmed: sync the in-memory model (no reload, no re-render, focus is kept). */
        const c = COURSES.find(x=>x.id === courseId);
        if(c) c[field] = value;
      }catch(err){
        console.error("AutoSave error:", err && err.code, err && err.message);
        if(err && (err.kind === "AUTH" || err.kind === "CANCELLED")) return;
        /* Restore the last confirmed value instead of showing an unsaved edit as saved. */
        const c = COURSES.find(x=>x.id === courseId);
        document.querySelectorAll("input.autoInput[data-cid]").forEach(i=>{
          if(i.dataset.cid === courseId && i.dataset.field === field && i.value === value){
            i.value = c ? safeStr(c[field]) : "";
          }
        });
        alert(err && err.kind === "FORBIDDEN" ? "Error saving: access denied." : "Error saving. Check console.");
      }finally{
        showSaving(false);
      }
    });
  }, 600);
}

/* ================= LOAD ================= */
/* Student counts: LOADING / COMPLETE / ERROR. Counts are never shown as final until COMPLETE. */
let STUDENTS_STATE = "loading";
let STUDENT_CTL = null;
let COURSE_CTL = null;
let LISTENERS_ATTACHED = false;
function studentsReady(){ return STUDENTS_STATE === "complete"; }
function ensureStatusBanner(){
  let el = document.getElementById("dataStatus");
  if(el) return el;
  el = document.createElement("div");
  el.id = "dataStatus";
  el.style.cssText = "display:none;margin:12px auto 0;width:92%;background:#fff8dc;border:1px solid #f1c40f;color:#5a4a00;padding:10px 14px;border-radius:10px;font-weight:800;font-size:13px;text-align:center";
  const row = document.querySelector(".filterRow");
  row.parentNode.insertBefore(el, row);
  return el;
}
function setStudentsState(state, info){
  STUDENTS_STATE = state;
  const el = ensureStatusBanner();
  if(state === "complete"){ el.style.display = "none"; el.textContent = ""; return; }
  el.style.display = "block";
  el.textContent = "";
  if(state === "loading"){
    el.textContent = "Loading student counts… (" + (info || 0) + " students read) — totals show … until complete";
  }else{
    el.textContent = "Student counts are INCOMPLETE (" + ((info && info.message) || "error") + "). ";
    const b = document.createElement("button");
    b.textContent = "Retry";
    b.className = "resetBtn";
    b.style.display = "inline-flex";
    b.style.marginInlineStart = "10px";
    b.onclick = ()=>loadStudentCounts();
    el.appendChild(b);
  }
}
function rerenderWhenIdle(){
  const a = document.activeElement;
  if(a && a.classList && a.classList.contains("autoInput")){
    a.addEventListener("blur", ()=>render(), {once:true});   /* do not steal focus while typing */
  }else{
    render();
  }
}
async function loadStudentCounts(){
  if(STUDENT_CTL) STUDENT_CTL.abort();
  const ctl = new AbortController();
  STUDENT_CTL = ctl;
  setStudentsState("loading", 0);
  const tmp = {};
  try{
    await PrudleDB.queryAll("students", {
      signal: ctl.signal,
      onPage: (docs, total)=>{
        for(const s of docs){
          const cid = s.courseId;
          if(cid){ tmp[cid] = (tmp[cid] || 0) + 1; }
        }
        setStudentsState("loading", total);
      }
    });
    if(ctl.signal.aborted) return;
    STUDENT_COUNT = tmp;
    setStudentsState("complete");
    rerenderWhenIdle();
  }catch(e){
    if(ctl.signal.aborted || (e && (e.kind === "CANCELLED" || e.kind === "AUTH"))) return;
    console.error("students load error:", e && e.code, e && e.message);
    setStudentsState("error", e);
    rerenderWhenIdle();
  }
}
(async function init(){
  loadLogo();
  async function run(){
    try{
      await PrudleAuth.bootstrap();
      if(COURSE_CTL) COURSE_CTL.abort();
      const ctl = new AbortController();
      COURSE_CTL = ctl;
      PrudleAuth.gate("Loading courses…", null);
      const res = await PrudleDB.queryAll("Courses", {signal: ctl.signal});
      if(ctl.signal.aborted) return;
      COURSES = res.documents;                       /* complete: every page confirmed by the Worker */
      FILTERS_SIGNATURE = getFiltersSignature();
      fillFilters();
      if(!LISTENERS_ATTACHED){
        LISTENERS_ATTACHED = true;
        document.querySelectorAll(".filterRow select").forEach(s=>{
          s.addEventListener("change", ()=>{
            clearTimeout(renderTimer);
            renderTimer = setTimeout(render, 120);
          });
        });
      }
      ensureStatusBanner();
      PrudleAuth.reveal();
      render();
      loadStudentCounts();
    }catch(e){
      if(!(e && (e.kind === "AUTH" || e.code === "REDIRECTED"))) console.error("init error:", e && e.code, e && e.message);
      PrudleAuth.fail(e, run);
    }
  }
  run();
})();

/* ================= FILTERS FILL ================= */
function fillFilters(){
  if(!window.branch) return;

  const b = branch.value;
  const s = section.value;
  const t = trainer.value;
  const c = course.value;
  const p = period.value;
  const d = date.value;

  const branchOptions = ['<option value="">Branch</option>'];
  const trainerOptions = ['<option value="">Trainer</option>'];
  const courseOptions = ['<option value="">Course</option>'];
  const periodOptions = ['<option value="">Period</option>'];
  const dateOptions = ['<option value="">Start Date</option>'];

  uniq(COURSES.map(x=>x.Branch)).forEach(v=>{
    branchOptions.push(`<option value="${safeStr(v)}">${safeStr(v)}</option>`);
  });

  uniq(COURSES.map(x=>x.Trainer)).forEach(v=>{
    trainerOptions.push(`<option value="${safeStr(v)}">${safeStr(v)}</option>`);
  });

  uniq(COURSES.map(x=>x.TrainingCourse)).forEach(v=>{
    courseOptions.push(`<option value="${safeStr(v)}">${safeStr(v)}</option>`);
  });

  uniq(COURSES.map(x=>x.Period)).forEach(v=>{
    periodOptions.push(`<option value="${safeStr(v)}">${safeStr(v)}</option>`);
  });

  /* ===== فلتر التاريخ مع تمييز آخر 5 ===== */
  DATE_CACHE = uniq(COURSES.map(x=>formatDate(x.StartingDate)));

  const sortedDates = DATE_CACHE
    .map(val => ({
      text: val,
      value: new Date(val).getTime()
    }))
    .filter(item => item.text !== "-" && !isNaN(item.value))
    .sort((a,b)=>b.value - a.value);

  const latest5 = sortedDates.slice(0,5).map(item=>item.text);

  sortedDates.forEach(item=>{
    const isRecent = latest5.includes(item.text);

    dateOptions.push(`
      <option value="${item.text}" style="${isRecent ? 'color:#27ae60;font-weight:900;' : ''}">
        ${isRecent ? '□ ' : ''}${item.text}
      </option>
    `);
  });

  branch.innerHTML = branchOptions.join("");
  trainer.innerHTML = trainerOptions.join("");
  course.innerHTML = courseOptions.join("");
  period.innerHTML = periodOptions.join("");
  date.innerHTML = dateOptions.join("");

  branch.value = b;
  section.value = s;
  trainer.value = t;
  course.value = c;
  period.value = p;
  date.value = d;
}

function resetFilters(){
  branch.value="";
  section.value="";
  trainer.value="";
  course.value="";
courseType.value="";
  period.value="";
  date.value="";
  SORT = { key:null, dir:1 };
ACTIVE_MODE = false;
  document.querySelectorAll("th i").forEach(i=>i.className="");
  render();
}
function showAllActiveCourses(){

  // ✅ إلغاء كل الفلاتر
  branch.value = "";
  section.value = "";
  trainer.value = "";
  course.value = "";
  period.value = "";
  date.value = "";

  // ✅ عرض كل الدورات
ACTIVE_MODE = true;
  FILTERED = COURSES.filter(c=>{

    const status = String(c.status || "")
      .trim()
      .toLowerCase();

const isOpen =
  status === "open" ||
  status === "مفتوح";

if(!isOpen) return false;

// ✅ فلترة النوع
if(courseType.value){

  const type = String(c.CourseType || "")
    .trim()
    .toLowerCase();

  const isOnline =
    type.includes("online") ||
    type.includes("اونلاين") ||
    type.includes("zoom") ||
    type.includes("virtual");

  // ✅ Online
  if(courseType.value === "online" && !isOnline){
    return false;
  }

  // ✅ In Person
  if(courseType.value === "inperson" && isOnline){
    return false;
  }

}

return true;
  });

  // ✅ تحديث الجدول
  FILTERED = applySort(FILTERED);
ACTIVE_MODE = true;
render();
updateSummary(
  FILTERED.reduce((a,c)=>a+(STUDENT_COUNT[c.id]||0),0),
  ["Active Courses"]
);

}
function renderActiveCourses(){

  rows.innerHTML = "";

  if(FILTERED.length === 0){

    emptyMsg.style.display = "block";
    emptyMsg.innerText = "No active courses";

    studentsCounter.innerText = "Total Students: 0";

    return;
  }

  emptyMsg.style.display = "none";

  let html = "";
  let grandTotal = 0;

  FILTERED.forEach(c=>{

    const count = STUDENT_COUNT[c.id] || 0;

    grandTotal += count;

    const cls =
      (count===0) ? "st-low" :
      (count<10) ? "st-mid" :
      "st-high";

    html += `
      <tr>

<td>
  <input
    class="autoInput"
    value="${safeStr(c.CourseNumber)}"
    oninput="autoSave('${c.id}','CourseNumber',this.value)" data-cid="${c.id}" data-field="CourseNumber"
    placeholder="Course No"
  />
</td>

<td>
  <input
    class="autoInput"
    value="${safeStr(c.ApprovalNumber)}"
    oninput="autoSave('${c.id}','ApprovalNumber',this.value)" data-cid="${c.id}" data-field="ApprovalNumber"
    placeholder="Approval No"
  />
</td>        <td>${safeStr(c.TrainingCourse) || "-"}</td>
        <td>${safeStr(c.Room) || "-"}</td>
        <td>${safeStr(c.Branch) || "-"}</td>
<td>${safeStr(c.Section) || "-"}</td>

<td>
  ${
    (() => {
      const type = String(c.CourseType || "")
        .trim()
        .toLowerCase();

      return (
        type.includes("online") ||
        type.includes("اون") ||
        type.includes("zoom") ||
        type.includes("virtual")
      )
        ? "Online"
        : "In Person";
    })()
  }
</td>
<td>${safeStr(c.Trainer) || "-"}</td>        <td>${safeStr(c.Period) || "-"}</td>
        <td>${safeStr(c.Note) || "-"}</td>
        <td>${formatDate(c.StartingDate)}</td>
        <td>${formatDate(c.EndingDate)}</td>

        <td class="${studentsReady() ? cls : ''}">
          ${studentsReady() ? count : "…"}
        </td>

      </tr>
    `;

  });

  rows.innerHTML = html;

  studentsCounter.innerText =
    "Total Students: " + (studentsReady() ? grandTotal : "…");

}

/* ================= SORT ================= */
function sortTable(key){

  if(SORT.key === key){
    SORT.dir *= -1;
  }else{
    SORT.key = key;
    SORT.dir = 1;
  }

  document.querySelectorAll("th i").forEach(i=>{
    i.className = "";
  });

  const icon = document.getElementById("s-" + key);
  if(icon){
    icon.className = iconFor(SORT.dir);
  }

  // ✅ إذا زر Active Courses شغال
  if(ACTIVE_MODE === true){

    FILTERED = applySort(FILTERED);

    renderActiveCourses();

    return;
  }

  // ✅ الوضع الطبيعي مع الفلاتر
  render();

}
function applySort(list){
  if(!SORT.key) return list;

  const key = SORT.key;
  const dir = SORT.dir;

  return list.slice().sort((a,b)=>{
    let x, y;

    if(key === "students"){
      x = STUDENT_COUNT[a.id] || 0;
      y = STUDENT_COUNT[b.id] || 0;
      return (x>y ? dir : x<y ? -dir : 0);
    }

    x = a[key];
    y = b[key];

    if(key === "StartingDate" || key === "EndingDate"){
      const xs = (x && x.seconds) ? x.seconds : (x ? new Date(x).getTime()/1000 : 0);
      const ys = (y && y.seconds) ? y.seconds : (y ? new Date(y).getTime()/1000 : 0);
      return (xs>ys ? dir : xs<ys ? -dir : 0);
    }

    const xv = normalizeSortVal(x);
    const yv = normalizeSortVal(y);
    return (xv>yv ? dir : xv<yv ? -dir : 0);
  });
}

/* ================= FILTER GATE ================= */
function hasAnyFilter(){
  return !!(
    branch.value ||
    section.value ||
    trainer.value ||
    course.value ||
    courseType.value ||
    period.value ||
    date.value
  );
}
/* ================= SUMMARY ================= */
function updateSummary(grandTotal, periodKeys){
  if((!hasAnyFilter() && !ACTIVE_MODE) || !FILTERED || FILTERED.length===0){
    summaryBox.style.display="none";
    return;
  }

  summaryBox.style.display="block";

  const branches = uniq(FILTERED.map(c=>safeStr(c.Branch)));
  const sections = uniq(FILTERED.map(c=>safeStr(c.Section)));
  const starts   = uniq(FILTERED.map(c=>formatDate(c.StartingDate)).filter(v=>v!=="-"));
  const ends     = uniq(FILTERED.map(c=>formatDate(c.EndingDate)).filter(v=>v!=="-"));

  const branchTxt = branch.value || (branches.length ? branches.join(", ") : "All");
  const sectionTxt = section.value || (sections.length ? sections.join(", ") : "All");

  let startTxt = "Multiple";
  let endTxt = "Multiple";

  if(date.value){
    startTxt = date.value;
  }else if(starts.length===1){
    startTxt = starts[0];
  }else if(starts.length===0){
    startTxt = "-";
  }

  if(ends.length===1){
    endTxt = ends[0];
  }else if(ends.length===0){
    endTxt = "-";
  }

  summaryContent.innerHTML = `
    <div>□ Branch: ${branchTxt}</div>
    <div>□ Section: ${sectionTxt}</div>
    <div>□ Courses: ${FILTERED.length}</div>
    <div>□ Total Students: ${studentsReady() ? grandTotal : "…"}</div>
    <div>□ Periods: ${periodKeys.length}</div>
    <div>□ Start Date: ${startTxt}</div>
    <div>□ End Date: ${endTxt}</div>
  `;
}

function getLatest5Dates(list){
  const dates = list
    .map(c => {
      if(!c.StartingDate) return null;
      if(c.StartingDate.seconds) return c.StartingDate.seconds;
      const t = new Date(c.StartingDate).getTime();
      return isNaN(t) ? null : (t / 1000);
    })
    .filter(v => v !== null)
    .sort((a,b) => b - a);

  return dates.slice(0,5);
}

function render(){

  if(!rows) return;

  rows.innerHTML = "";

  // ✅ لا توجد فلاتر ولا Active
  if(!hasAnyFilter() && !ACTIVE_MODE){

    FILTERED = [];

    studentsCounter.innerText = "Total Students: 0";

    emptyMsg.style.display = "block";

    emptyMsg.innerText =
      "Please select at least one filter to display data";

    summaryBox.style.display = "none";

    return;
  }

  emptyMsg.style.display = "none";

  /* ================= FILTER ================= */

  FILTERED = COURSES.filter(c=>{

    // ✅ Active Courses Mode
    if(ACTIVE_MODE){

      const status = String(c.status || "")
        .trim()
        .toLowerCase();

      const isOpen =
        status === "open" ||
        status === "مفتوح";

      if(!isOpen) return false;
    }

    // ===== Branch =====
    if(branch.value &&
       safeStr(c.Branch) !== branch.value){
      return false;
    }

    // ===== Section =====
    if(section.value){

      if(section.value === "Kids+Women"){

        if(
          !(
            safeStr(c.Section)==="Kids" ||
            safeStr(c.Section)==="Women"
          )
        ){
          return false;
        }

      }else{

        if(
          safeStr(c.Section) !== section.value
        ){
          return false;
        }
      }
    }

    // ===== Trainer =====
    if(
      trainer.value &&
      safeStr(c.Trainer) !== trainer.value
    ){
      return false;
    }

    // ===== Course =====
    if(
      course.value &&
      safeStr(c.TrainingCourse) !== course.value
    ){
      return false;
    }

    // ===== Period =====
    if(
      period.value &&
      safeStr(c.Period) !== period.value
    ){
      return false;
    }

    // ===== Course Type =====
    if(courseType.value){

      const type = String(c.CourseType || "")
        .trim()
        .toLowerCase();

      const isOnline =
        type.includes("online") ||
        type.includes("اونلاين") ||
        type.includes("اون") ||
        type.includes("zoom") ||
        type.includes("virtual");

      if(
        courseType.value === "online" &&
        !isOnline
      ){
        return false;
      }

      if(
        courseType.value === "inperson" &&
        isOnline
      ){
        return false;
      }
    }

    // ===== Date =====
    if(
      date.value &&
      formatDate(c.StartingDate) !== date.value
    ){
      return false;
    }

    return true;

  });
  const latestDates = getLatest5Dates(FILTERED);
  const sorted = applySort(FILTERED);

  const grouped = {};
  sorted.forEach(c=>{
    const p = safeStr(c.Period) || "No Period";
    if(!grouped[p]) grouped[p] = [];
    grouped[p].push(c);
  });

  let grandTotal = 0;
  const periodKeys = Object.keys(grouped).sort((a,b)=>
    a.localeCompare(b,undefined,{numeric:true,sensitivity:"base"})
  );

  if(periodKeys.length===0){
    studentsCounter.innerText = "Total Students: 0";
    emptyMsg.style.display = "block";
    emptyMsg.innerText = "No results for current filters";
    summaryBox.style.display="none";
    return;
  }

  let html = "";

  periodKeys.forEach(p=>{
    const list = grouped[p];

    let periodTotal = 0;
    list.forEach(c=>periodTotal += (STUDENT_COUNT[c.id] || 0));
    grandTotal += periodTotal;

    html += `
      <tr class="periodHeader">
        <td colspan="13">${p} — Total Students: ${studentsReady() ? periodTotal : "…"}</td>
      </tr>
    `;

    list.forEach(c=>{
      const count = STUDENT_COUNT[c.id] || 0;
      const cls = (count===0) ? "st-low" : (count<10) ? "st-mid" : "st-high";

      const startRaw = c.StartingDate?.seconds
        ? c.StartingDate.seconds
        : (c.StartingDate ? new Date(c.StartingDate).getTime()/1000 : null);

      const isRecent = startRaw && latestDates.some(d => Math.abs(d - startRaw) < 2);

      html += `
        <tr>
          <td>
            <input class="autoInput" value="${safeStr(c.CourseNumber)}"
              oninput="autoSave('${c.id}','CourseNumber',this.value)" data-cid="${c.id}" data-field="CourseNumber" />
          </td>

          <td>
            <input class="autoInput" value="${safeStr(c.ApprovalNumber)}"
              oninput="autoSave('${c.id}','ApprovalNumber',this.value)" data-cid="${c.id}" data-field="ApprovalNumber" />
          </td>

          <td>${safeStr(c.TrainingCourse) || "-"}</td>
          <td>${safeStr(c.Room) || "-"}</td>
          <td>${safeStr(c.Branch) || "-"}</td>
          <td>${safeStr(c.Section) || "-"}</td>

          <td>
            ${
              (() => {
                const type = String(c.CourseType || "").trim().toLowerCase();
                return (
                  type.includes("online") ||
                  type.includes("اونلاين") ||
                  type.includes("اون") ||
                  type.includes("zoom") ||
                  type.includes("virtual")
                ) ? "Online" : "In Person";
              })()
            }
          </td>

          <td>${safeStr(c.Trainer) || "-"}</td>
          <td>${safeStr(c.Period) || "-"}</td>

          <td>
            <input class="autoInput" value="${safeStr(c.Note)}"
              oninput="autoSave('${c.id}','Note',this.value)" data-cid="${c.id}" data-field="Note" placeholder="Write note..." />
          </td>

          <td style="${isRecent ? 'background:#27ae60;color:#fff;font-weight:900' : ''}">
            ${formatDate(c.StartingDate)}
          </td>

          <td>${formatDate(c.EndingDate)}</td>
          <td class="${studentsReady() ? cls : ''}">${studentsReady() ? count : "…"}</td>
        </tr>
      `;
    });
  });

  rows.innerHTML = html;
  studentsCounter.innerText = "Total Students: " + (studentsReady() ? grandTotal : "…");
  updateSummary(grandTotal, periodKeys);
}
/* ===============================
   استخراج النتائج حسب الفلترة الحالية
================================ */
function getCurrentFilteredCourses(){

  return COURSES.filter(c=>{

    /* الدورات النشطة فقط عند تشغيل Active Courses */
    if(ACTIVE_MODE){

      const status = String(c.status || "")
        .trim()
        .toLowerCase();

      const isOpen =
        status === "open" ||
        status === "مفتوح";

      if(!isOpen) return false;
    }

    /* الفرع */
    if(
      branch.value &&
      safeStr(c.Branch) !== branch.value
    ){
      return false;
    }

    /* القسم */
    if(section.value){

      if(section.value === "Kids+Women"){

        const currentSection =
          safeStr(c.Section);

        if(
          currentSection !== "Kids" &&
          currentSection !== "Women"
        ){
          return false;
        }

      }else if(
        safeStr(c.Section) !== section.value
      ){
        return false;
      }
    }

    /* المدرب */
    if(
      trainer.value &&
      safeStr(c.Trainer) !== trainer.value
    ){
      return false;
    }

    /* الدورة */
    if(
      course.value &&
      safeStr(c.TrainingCourse) !== course.value
    ){
      return false;
    }

    /* الفترة */
    if(
      period.value &&
      safeStr(c.Period) !== period.value
    ){
      return false;
    }

    /* نوع الدورة */
    if(courseType.value){

      const type =
        String(c.CourseType || "")
          .trim()
          .toLowerCase();

      const isOnline =
        type.includes("online") ||
        type.includes("اونلاين") ||
        type.includes("اون") ||
        type.includes("zoom") ||
        type.includes("virtual");

      if(
        courseType.value === "online" &&
        !isOnline
      ){
        return false;
      }

      if(
        courseType.value === "inperson" &&
        isOnline
      ){
        return false;
      }
    }

    /* تاريخ البداية */
    if(
      date.value &&
      formatDate(c.StartingDate) !== date.value
    ){
      return false;
    }

    return true;
  });
}
