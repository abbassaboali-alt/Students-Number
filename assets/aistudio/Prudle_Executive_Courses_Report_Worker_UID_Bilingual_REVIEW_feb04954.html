(function(){
"use strict";
const LOGIN="https://www.prudle-education.com/log-in-out";
const HOSTS=new Set(["www.prudle-education.com","prudle-education.com","abbassaboali-alt.github.io"]);
window.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="s")e.preventDefault()},true);
if(location.protocol!=="https:"||!HOSTS.has(location.hostname.toLowerCase())){
  window.stop(); location.replace(LOGIN); return;
}
const token=sessionStorage.getItem("firebaseToken");
const uid=sessionStorage.getItem("firebaseUid");
const started=Number(sessionStorage.getItem("prudleDeviceSessionStartedAt")||localStorage.getItem("prudleDeviceSessionStartedAt")||0);
const expired=started>0&&Date.now()-started>=86400000;

}
window.PRUDLE_AUTH={token,uid,started};
})();

<script>
/* Worker-only data access, authenticated at bootstrap */

/* ================= LOGO (TOP + WATERMARK) =================
   ملاحظة: إذا واجهت CORS مع الرابط، استبدله بـ Base64 DataURL (PNG) وستعمل 100%.
*/
const LOGO_URL = "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRlEGHcXcelOlihtrBLFCmjumIyuBxqyoWEZM8DgDpBVg&s";
let LOGO_DATA_URL = null;

/* تحميل الشعار مرة واحدة (مع fallback) */
function loadLogo(){
  return new Promise((resolve)=>{
    if(LOGO_DATA_URL) return resolve(LOGO_DATA_URL);

    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = ()=>{
      try{
        const c = document.createElement("canvas");
        c.width = img.naturalWidth || 600;
        c.height = img.naturalHeight || 300;
        const ctx = c.getContext("2d");
        ctx.drawImage(img,0,0);
        LOGO_DATA_URL = c.toDataURL("image/png");
        resolve(LOGO_DATA_URL);
      }catch(e){
        resolve(null);
      }
    };
    img.onerror = ()=>resolve(null);
    img.src = LOGO_URL;
  });
}


const PRUDLE_WORKER="https://api-prudle.abbassaboali.workers.dev";
function authRedirect(){location.replace("https://www.prudle-education.com/log-in-out");}
function currentToken(){
  const a=window.PRUDLE_AUTH;
  if(!a||!a.token||!a.uid){authRedirect();throw Error("No session");}
  if(a.started&&Date.now()-a.started>=86400000){authRedirect();throw Error("Session expired");}
  return a.token;
}
async function workerDb(payload){
  const controller=new AbortController();
  const timeout=setTimeout(()=>controller.abort(),20000);
  let response;
  try{
    response=await fetch(PRUDLE_WORKER+"/db",{
      method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+currentToken()},
      body:JSON.stringify(payload),signal:controller.signal
    });
  }finally{clearTimeout(timeout);}
  if(response.status===401){authRedirect();throw Error("Authentication expired");}
  if(response.status===403)throw Error("Access denied by Worker");
  if(!response.ok)throw Error("Worker HTTP "+response.status);
  const result=await response.json();
  if(result?.success===false||result?.error)throw Error(String(result?.error?.message||result?.error||"Worker error"));
  return result;
}
function docList(response){
  const data=response?.data??response;
  const items=data?.documents??data?.docs??data?.results;
  if(!Array.isArray(items))throw Error("Unverified Worker query response shape");
  return {items,data};
}
function normalizeDoc(d){
  const id=d.id||d.documentId||d.name?.split("/").pop();
  if(!id)throw Error("Missing document ID");
  const data=d.data||d.fields;
  if(!data||typeof data!=="object")throw Error("Missing document data");
  return {id,...data};
}
async function readAll(collection,filters=[]){
  const output=[],seen=new Set();
  let cursor=null;
  for(let page=0;page<1000;page++){
    const request={action:"query",collection,filters,limit:250,paginate:true};
    if(cursor)request.cursor=cursor;
    const response=await workerDb(request);
    const {items,data}=docList(response);
    for(const d of items){
      const obj=normalizeDoc(d);
      if(seen.has(obj.id))throw Error("Repeated document during pagination");
      seen.add(obj.id);output.push(obj);
    }
    const next=data.nextCursor??data.cursor??response.nextCursor;
    const hasMore=data.hasMore??response.hasMore;
    if(hasMore===false)return output;
    if(items.length<250&&!next)return output;
    // A full page without an explicit end marker is ambiguous and must fail closed.
    if(!next||next===cursor)throw Error("Pagination unsupported or incomplete: "+collection);
    cursor=next;
  }
  throw Error("Pagination safety limit reached");
}
async function authorizeAdmin(){
  const uid=window.PRUDLE_AUTH?.uid;
  const users=await readAll("USERS",[["authUid","==",uid]]);
  const record=users.find(x=>x.authUid===uid);
  if(!record||String(record.role||"").toLowerCase()!=="admin")throw Error("Admin authorization not confirmed");
}
async function updateCourse(id,field,value){
  if(!["CourseNumber","ApprovalNumber","Note"].includes(field))throw Error("Field not permitted");
  return workerDb({action:"updateDoc",path:"Courses/"+id,data:{[field]:value}});
}
let pollHandle=null;
async function reloadReport(){
  const [courses,students]=await Promise.all([readAll("Courses"),readAll("students")]);
  const counts={};
  for(const st of students)if(st.courseId)counts[st.courseId]=(counts[st.courseId]||0)+1;
  COURSES=courses;STUDENT_COUNT=counts;
  const sig=getFiltersSignature();
  if(sig!==FILTERS_SIGNATURE){FILTERS_SIGNATURE=sig;fillFilters();}
  render();
  prudleApplyLanguage(PRUDLE_LANGUAGE);
}
function reportError(e){
  console.error("Prudle report:",e);
  document.documentElement.classList.remove("prudle-authorized");
  const old=document.getElementById("prudleConnectionError");if(old)old.remove();
  const el=document.createElement("div");
  el.id="prudleConnectionError";
  el.style.cssText="position:fixed;inset:0;background:#f4f7fb;z-index:999999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:15px;font-family:Arial;text-align:center;padding:24px";
  const msg=document.createElement("strong");msg.textContent="Unable to verify access or load the report. No protected data is displayed.";
  const btn=document.createElement("button");btn.textContent="Retry";btn.onclick=()=>location.reload();
  el.append(msg,btn);document.body.append(el);
  document.documentElement.classList.add("prudle-authorized");
}


/* Language-only UI overlay. Original data, IDs, filters and layout are untouched. */
const PRUDLE_UI_AR = {"Prudle – Executive Courses Report": "برودل – التقرير التنفيذي للدورات", "Executive Summary": "الملخص التنفيذي", "Active Courses": "الدورات النشطة", "Branch": "الفرع", "Section": "القسم", "Trainer": "المدرب", "Course": "الدورة", "Type": "النوع", "Period": "الفترة", "Start Date": "تاريخ البداية", "PDF": "PDF", "Reset": "إعادة ضبط", "Online": "عن بُعد", "In Person": "حضوري", "Course No": "رقم الدورة", "Approval No": "رقم الاعتماد", "Room": "القاعة", "Note": "ملاحظة", "Start": "البداية", "End": "النهاية", "Students": "الطلاب", "Saving...": "جارٍ الحفظ...", "Please select at least one filter to display data": "يرجى اختيار فلتر واحد على الأقل لعرض البيانات", "No active courses": "لا توجد دورات نشطة", "No data found": "لا توجد بيانات", "Total Students: 0": "إجمالي الطلاب: 0", "Kids + Women": "الأطفال والنساء", "Women": "النساء", "Kids": "الأطفال", "Men": "الرجال", "Error saving. Check console.": "تعذر الحفظ. تحقق من وحدة التحكم."};
const PRUDLE_UI_EN = Object.fromEntries(Object.entries(PRUDLE_UI_AR).map(([en,ar])=>[ar,en]));
let PRUDLE_LANGUAGE = 'en';
function prudleTranslateString(str,language){
  const dict=language==='ar'?PRUDLE_UI_AR:PRUDLE_UI_EN;
  if(dict[str])return dict[str];
  const prefix=language==='ar'?'Total Students: ':'إجمالي الطلاب: ';
  const target=language==='ar'?'إجمالي الطلاب: ':'Total Students: ';
  if(str.startsWith(prefix))return target+str.slice(prefix.length);
  return str;
}
function prudleApplyLanguage(language){
  PRUDLE_LANGUAGE=language==='ar'?'ar':'en';
  document.documentElement.lang=PRUDLE_LANGUAGE;
  document.documentElement.dir=PRUDLE_LANGUAGE==='ar'?'rtl':'ltr';
  const switcher=document.getElementById('prudleLanguageSwitch');
  if(switcher)switcher.textContent=PRUDLE_LANGUAGE==='ar'?'English':'العربية';
  // Translate only fixed UI labels; never translate actual database values.
  const selectors=['header','.counter','.filterRow button','.filterRow option[value=""]','.filterRow #section option','.filterRow #courseType option','thead th','#emptyMsg','#summaryBox > div:first-child','#savingHint'];
  document.querySelectorAll(selectors.join(',')).forEach(el=>{
    if(el===switcher)return;
    const walker=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);
    let node;
    while((node=walker.nextNode())){
      const value=node.nodeValue;
      const m=value.match(/^(\s*)(.*?)(\s*)$/s);
      if(!m||!m[2])continue;
      const translated=prudleTranslateString(m[2],PRUDLE_LANGUAGE);
      if(translated!==m[2])node.nodeValue=m[1]+translated+m[3];
    }
  });
}
function togglePrudleLanguage(){prudleApplyLanguage(PRUDLE_LANGUAGE==='en'?'ar':'en');}

/* ================= DATA ================= */
let COURSES = [];
let STUDENT_COUNT = {};
let FILTERED = [];
let SORT = { key: null, dir: 1 };
let ACTIVE_MODE = false;
 // dir 1 asc, -1 desc

/* تحسينات الأداء */
let renderTimer = null;
let DATE_CACHE = [];
let FILTERS_SIGNATURE = "";

/* ================= HELPERS ================= */
function formatDate(d){
  if(!d) return "-";
  try{
    const dt = (d.seconds) ? new Date(d.seconds*1000) : new Date(d);
    if(isNaN(dt.getTime())) return "-";
    return dt.toISOString().split("T")[0];
  }catch(e){
    return "-";
  }
}
function uniq(arr){
  return [...new Set((arr||[]).filter(v=>v!==undefined && v!==null && (""+v).trim()!==""))];
}
function safeStr(v){
  return (v===undefined || v===null) ? "" : (""+v);
}
function normalizeSortVal(v){
  if(v===undefined || v===null) return "";
  if(v && typeof v === "object" && v.seconds) return v.seconds;
  return (""+v).toLowerCase();
}
function iconFor(dir){ return dir===1 ? "fa fa-sort-up" : "fa fa-sort-down"; }

function getFiltersSignature(){
  const branches = uniq(COURSES.map(x=>safeStr(x.Branch))).sort().join("|");
  const trainers = uniq(COURSES.map(x=>safeStr(x.Trainer))).sort().join("|");
  const courses  = uniq(COURSES.map(x=>safeStr(x.TrainingCourse))).sort().join("|");
  const periods  = uniq(COURSES.map(x=>safeStr(x.Period))).sort().join("|");
  const dates    = uniq(COURSES.map(x=>formatDate(x.StartingDate))).sort().join("|");
  return [branches, trainers, courses, periods, dates].join("###");
}

/* ================= AUTO SAVE (DEBOUNCE) ================= */
const saveTimers = {};
function showSaving(flag){
  const el = document.getElementById("savingHint");
  if(!el) return;
  el.style.display = flag ? "block" : "none";
}
function autoSave(courseId, field, value){
  const key = courseId + "_" + field;
  if(saveTimers[key]) clearTimeout(saveTimers[key]);

  showSaving(true);

  saveTimers[key] = setTimeout(async ()=>{
    try{
      await updateCourse(courseId,field,value);
    }catch(err){
      console.error("AutoSave error:", err);
      alert("Error saving. Check console.");
    }finally{
      showSaving(false);
    }
  }, 600);
}

/* ================= LOAD ================= */
(async function init(){
  try{
    if(!window.PRUDLE_AUTH)return;
    await authorizeAdmin();
    await reloadReport();
    loadLogo();
    document.querySelectorAll(".filterRow select").forEach(s=>{
      s.addEventListener("change",()=>{clearTimeout(renderTimer);renderTimer=setTimeout(render,120)});
    });
    document.documentElement.classList.add("prudle-authorized");
    prudleApplyLanguage("en");
    // Periodic refresh is not equivalent to Firestore onSnapshot.
    pollHandle=setInterval(()=>{if(!document.hidden)reloadReport().catch(e=>console.error("Refresh failed:",e))},30000);
  }catch(e){reportError(e);}
})();
/* ================= FILTERS FILL ================= */
function fillFilters(){
  if(!window.branch) return;

  const b = branch.value;
  const s = section.value;
  const t = trainer.value;
  const c = course.value;
  const p = period.value;
  const d = date.value;

  const branchOptions = ['<option value="">Branch</option>'];
  const trainerOptions = ['<option value="">Trainer</option>'];
  const courseOptions = ['<option value="">Course</option>'];
  const periodOptions = ['<option value="">Period</option>'];
  const dateOptions = ['<option value="">Start Date</option>'];

  uniq(COURSES.map(x=>x.Branch)).forEach(v=>{
    branchOptions.push(`<option value="${safeStr(v)}">${safeStr(v)}</option>`);
  });

  uniq(COURSES.map(x=>x.Trainer)).forEach(v=>{
    trainerOptions.push(`<option value="${safeStr(v)}">${safeStr(v)}</option>`);
  });

  uniq(COURSES.map(x=>x.TrainingCourse)).forEach(v=>{
    courseOptions.push(`<option value="${safeStr(v)}">${safeStr(v)}</option>`);
  });

  uniq(COURSES.map(x=>x.Period)).forEach(v=>{
    periodOptions.push(`<option value="${safeStr(v)}">${safeStr(v)}</option>`);
  });

  /* ===== فلتر التاريخ مع تمييز آخر 5 ===== */
  DATE_CACHE = uniq(COURSES.map(x=>formatDate(x.StartingDate)));

  const sortedDates = DATE_CACHE
    .map(val => ({
      text: val,
      value: new Date(val).getTime()
    }))
    .filter(item => item.text !== "-" && !isNaN(item.value))
    .sort((a,b)=>b.value - a.value);

  const latest5 = sortedDates.slice(0,5).map(item=>item.text);

/* ================= SORT ================= */
function sortTable(key){

  if(SORT.key === key){
    SORT.dir *= -1;
  }else{
    SORT.key = key;
    SORT.dir = 1;
  }

  document.querySelectorAll("th i").forEach(i=>{
    i.className = "";
  });

  const icon = document.getElementById("s-" + key);
  if(icon){
    icon.className = iconFor(SORT.dir);
  }

  // ✅ إذا زر Active Courses شغال
  if(ACTIVE_MODE === true){

    FILTERED = applySort(FILTERED);

    renderActiveCourses();

    return;
  }

  // ✅ الوضع الطبيعي مع الفلاتر
  render();

}
function applySort(list){
  if(!SORT.key) return list;

  const key = SORT.key;
  const dir = SORT.dir;

  return list.slice().sort((a,b)=>{
    let x, y;

    if(key === "students"){
      x = STUDENT_COUNT[a.id] || 0;
      y = STUDENT_COUNT[b.id] || 0;
      return (x>y ? dir : x<y ? -dir : 0);
    }

    x = a[key];
    y = b[key];

    if(key === "StartingDate" || key === "EndingDate"){
      const xs = (x && x.seconds) ? x.seconds : (x ? new Date(x).getTime()/1000 : 0);
      const ys = (y && y.seconds) ? y.seconds : (y ? new Date(y).getTime()/1000 : 0);
      return (xs>ys ? dir : xs<ys ? -dir : 0);
    }

    const xv = normalizeSortVal(x);
    const yv = normalizeSortVal(y);
    return (xv>yv ? dir : xv<yv ? -dir : 0);
  });
}

  const ends     = uniq(FILTERED.map(c=>formatDate(c.EndingDate)).filter(v=>v!=="-"));

  let endTxt = "Multiple";

function getLatest5Dates(list){
  const dates = list
    .map(c => {
      if(!c.StartingDate) return null;
      if(c.StartingDate.seconds) return c.StartingDate.seconds;
      const t = new Date(c.StartingDate).getTime();
      return isNaN(t) ? null : (t / 1000);
    })
    .filter(v => v !== null)
    .sort((a,b) => b - a);

  return dates.slice(0,5);
}
