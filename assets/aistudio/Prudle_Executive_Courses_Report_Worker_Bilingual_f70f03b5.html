<script>
/* ================= FIREBASE ================= */
/* Firestore access is routed through the authenticated Prudle Worker. */

/* ================= LOGO (TOP + WATERMARK) =================
   ملاحظة: إذا واجهت CORS مع الرابط، استبدله بـ Base64 DataURL (PNG) وستعمل 100%.
*/
const LOGO_URL = "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRlEGHcXcelOlihtrBLFCmjumIyuBxqyoWEZM8DgDpBVg&s";
let LOGO_DATA_URL = null;

/* تحميل الشعار مرة واحدة (مع fallback) */
function loadLogo(){
  return new Promise((resolve)=>{
    if(LOGO_DATA_URL) return resolve(LOGO_DATA_URL);

    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = ()=>{
      try{
        const c = document.createElement("canvas");
        c.width = img.naturalWidth || 600;
        c.height = img.naturalHeight || 300;
        const ctx = c.getContext("2d");
        ctx.drawImage(img,0,0);
        LOGO_DATA_URL = c.toDataURL("image/png");
        resolve(LOGO_DATA_URL);
      }catch(e){
        resolve(null);
      }
    };
    img.onerror = ()=>resolve(null);
    img.src = LOGO_URL;
  });
}

/* ================= PRUDLE WORKER / AUTH ================= */
const PRUDLE_API='https://api-prudle.abbassaboali.workers.dev';
const LOGIN_URL='https://www.prudle-education.com/log-in-out';
const PARENT_ORIGIN='https://www.prudle-education.com';
let AUTH_TOKEN='',AUTH_SESSION='', AUTH_UID='', authResolver=null;
const authWait=new Promise(resolve=>authResolver=resolve);
const authKeys=['firebaseToken','firebaseUid','prudleSessionToken','sessionToken','PRUDLE_SESSION_TOKEN'];
function stored(k){return sessionStorage.getItem(k)||'';}
function takeAuth(){AUTH_TOKEN=stored('firebaseToken')||stored('idToken')||'';AUTH_UID=stored('firebaseUid')||'';AUTH_SESSION=stored('prudleSessionToken')||stored('sessionToken')||stored('PRUDLE_SESSION_TOKEN')||'';}
function redirectLogin(){for(const k of authKeys)sessionStorage.removeItem(k);location.replace(LOGIN_URL);}
window.addEventListener('message',e=>{
 if(e.origin!==PARENT_ORIGIN||e.source!==window.parent)return;
 if(e.data?.type==='PRUDLE_AUTH'&&typeof e.data.firebaseToken==='string'){
  AUTH_TOKEN=e.data.firebaseToken;AUTH_UID=String(e.data.firebaseUid||'');AUTH_SESSION=String(e.data.sessionToken||'');
  if(AUTH_TOKEN){sessionStorage.setItem('firebaseToken',AUTH_TOKEN);if(AUTH_UID)sessionStorage.setItem('firebaseUid',AUTH_UID);if(AUTH_SESSION)sessionStorage.setItem('prudleSessionToken',AUTH_SESSION);authResolver();}
 }
 if(e.data?.type==='PRUDLE_LOGOUT')redirectLogin();
});
function safeError(message){document.documentElement.style.visibility='visible';document.body.innerHTML='<div style="font-family:Arial;text-align:center;padding:15vh 24px;color:#123"><h2>'+message+'</h2><button id="retryAuth" style="padding:12px 24px">Retry</button></div>';document.getElementById('retryAuth').onclick=()=>location.reload();}
async function api(action,signal){
 const headers={'Content-Type':'application/json','Authorization':'Bearer '+AUTH_TOKEN};
 if(AUTH_SESSION)headers['X-Prudle-Session']=AUTH_SESSION;
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),18000);
 try{
  const res=await fetch(PRUDLE_API+'/db',{method:'POST',headers,body:JSON.stringify(action),signal:signal||controller.signal});
  const data=await res.json().catch(()=>({}));
  if(res.status===401){redirectLogin();throw Error('AUTH_EXPIRED')}
  if(res.status===403)throw Error('ACCESS_DENIED');
  if(!res.ok||data.success===false)throw Error(data.error||'Worker request failed: '+res.status);
  return data.data||data;
 }finally{clearTimeout(timer)}
}
async function allDocs(collection){
 const docs=new Map();let cursor=null,seen=new Set();
 for(;;){
  const result=await api({action:'query',collection,filters:[],limit:400,paginate:true,...(cursor?{cursor}:{})});
  if(!Array.isArray(result.documents))throw Error('Invalid pagination response for '+collection);
  result.documents.forEach(d=>{if(d&&d.id)docs.set(d.id,d)});
  if(!result.hasMore)break;
  if(!result.nextCursor||seen.has(result.nextCursor))throw Error('BACKEND_PAGINATION_REQUIRED');
  seen.add(result.nextCursor);cursor=result.nextCursor;
 }
 return [...docs.values()];
}
async function authenticate(){
 takeAuth();
 if(!AUTH_TOKEN&&window.parent!==window){window.parent.postMessage({type:'PRUDLE_AUTH_REQUEST'},PARENT_ORIGIN);await Promise.race([authWait,new Promise(r=>setTimeout(r,1100))]);takeAuth();}
 if(!AUTH_TOKEN){redirectLogin();return false;}
 // A valid Worker response proves token acceptance for the requested read, not broad privileges.
 let uid=AUTH_UID;
 if(!uid){try{const payload=JSON.parse(atob(AUTH_TOKEN.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));uid=String(payload.user_id||payload.sub||'')}catch(_){}}
 if(!uid){throw Error('LOGIN_UID_NOT_AVAILABLE');}
 // The UID decoded above is only a lookup hint; /db verifies the Bearer token server-side.
 const users=await api({action:'query',collection:'USERS',filters:[{field:'authUid',op:'==',value:uid}],limit:10});
 const records=users.documents||[];
 const u=records.find(x=>x.authUid===uid);
 if(!u)throw Error('ACCESS_DENIED');
 const roles=[u.role,...(Array.isArray(u.roles)?u.roles:[])].filter(Boolean).map(x=>String(x).toLowerCase());
 if(!roles.includes('admin'))throw Error('ACCESS_DENIED');
 return true;
}
/* English is default; localization never mutates database values. */
let LANG=localStorage.getItem('prudle.ui.language')==='ar'?'ar':'en';
const LABELS={
 'Prudle – Executive Courses Report':'تقرير الدورات التنفيذي - برودل','Total Students:':'إجمالي الطلاب:',
 'Active Courses':'الدورات النشطة','Branch':'الفرع','Section':'القسم','Trainer':'المدرب','Course':'الدورة','Type':'النوع','Online':'عن بُعد','In Person':'حضوري','Period':'الفترة','Start Date':'تاريخ البداية','PDF':'PDF','Reset':'إعادة تعيين',
 'Course No':'رقم الدورة','Approval No':'رقم الاعتماد','Room':'القاعة','Note':'ملاحظات','Start':'البداية','End':'النهاية','Students':'الطلاب','Executive Summary':'الملخص التنفيذي',
 'Please select at least one filter to display data':'يرجى اختيار فلتر واحد على الأقل لعرض البيانات','No active courses':'لا توجد دورات نشطة','No data found':'لا توجد بيانات','Saving...':'جارٍ الحفظ...','Write note...':'اكتب ملاحظة...','All':'الكل'
};
const REVERSE=Object.fromEntries(Object.entries(LABELS).map(([a,b])=>[b,a]));
function tr(v){if(LANG==='en')return REVERSE[v]||v;return LABELS[v]||v}
function localize(){
 document.documentElement.lang=LANG;document.documentElement.dir=LANG==='ar'?'rtl':'ltr';
 const sw=document.getElementById('langSwitch');if(sw)sw.textContent=LANG==='ar'?'English':'العربية';
 document.querySelectorAll('header, .filterRow, .tableBox, #summaryBox, #savingHint').forEach(root=>{
  const walk=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let node;
  while(node=walk.nextNode()){
   if(node.parentElement?.closest('tbody, #summaryContent, .autoInput'))continue;
   const val=node.nodeValue,trim=val.trim();if(!trim)continue;
   if(LABELS[trim]||REVERSE[trim])node.nodeValue=val.replace(trim,tr(trim));
   else if(/^Total Students:\s*\d+$/.test(trim)||/^إجمالي الطلاب:\s*\d+$/.test(trim))node.nodeValue=val.replace(trim,tr('Total Students:')+' '+trim.match(/\d+$/)[0]);
  }
 });
 document.querySelectorAll('input[placeholder]').forEach(x=>{x.placeholder=tr(x.placeholder)});
}
function initLanguage(){const b=document.getElementById('langSwitch');if(b)b.onclick=()=>{LANG=LANG==='en'?'ar':'en';localStorage.setItem('prudle.ui.language',LANG);localize();render()};localize();}

/* ================= DATA ================= */
let COURSES = [];
let STUDENT_COUNT = {};
let FILTERED = [];
let SORT = { key: null, dir: 1 };
let ACTIVE_MODE = false;
 // dir 1 asc, -1 desc

/* تحسينات الأداء */
let renderTimer = null;
let DATE_CACHE = [];
let FILTERS_SIGNATURE = "";

/* ================= HELPERS ================= */
function formatDate(d){
  if(!d) return "-";
  try{
    const dt = (d.seconds) ? new Date(d.seconds*1000) : new Date(d);
    if(isNaN(dt.getTime())) return "-";
    return dt.toISOString().split("T")[0];
  }catch(e){
    return "-";
  }
}
function uniq(arr){
  return [...new Set((arr||[]).filter(v=>v!==undefined && v!==null && (""+v).trim()!==""))];
}
function safeStr(v){
  return (v===undefined || v===null) ? "" : (""+v);
}
function normalizeSortVal(v){
  if(v===undefined || v===null) return "";
  if(v && typeof v === "object" && v.seconds) return v.seconds;
  return (""+v).toLowerCase();
}
function iconFor(dir){ return dir===1 ? "fa fa-sort-up" : "fa fa-sort-down"; }

function getFiltersSignature(){
  const branches = uniq(COURSES.map(x=>safeStr(x.Branch))).sort().join("|");
  const trainers = uniq(COURSES.map(x=>safeStr(x.Trainer))).sort().join("|");
  const courses  = uniq(COURSES.map(x=>safeStr(x.TrainingCourse))).sort().join("|");
  const periods  = uniq(COURSES.map(x=>safeStr(x.Period))).sort().join("|");
  const dates    = uniq(COURSES.map(x=>formatDate(x.StartingDate))).sort().join("|");
  return [branches, trainers, courses, periods, dates].join("###");
}

/* ================= AUTO SAVE (DEBOUNCE) ================= */
const saveTimers = {};
function showSaving(flag){
  const el = document.getElementById("savingHint");
  if(!el) return;
  el.style.display = flag ? "block" : "none";
}
function autoSave(courseId, field, value){
  const key = courseId + "_" + field;
  if(saveTimers[key]) clearTimeout(saveTimers[key]);

  showSaving(true);

  saveTimers[key] = setTimeout(async ()=>{
    try{
      await api({action:'updateDoc',path:'Courses/'+courseId,data:{[field]:value}});
      const item=COURSES.find(c=>c.id===courseId);if(item)item[field]=value;
    }catch(err){
      console.error("AutoSave error:", err);
      alert("Error saving. Check console.");
    }finally{
      showSaving(false);
    }
  }, 600);
}

/* ================= LOAD ================= */
(async function init(){
 try{
  if(!await authenticate())return;
  loadLogo();
  const [courses,students]=await Promise.all([allDocs('Courses'),allDocs('students')]);
  COURSES=courses;
  STUDENT_COUNT={};
  students.forEach(data=>{if(data.courseId)STUDENT_COUNT[data.courseId]=(STUDENT_COUNT[data.courseId]||0)+1});
  FILTERS_SIGNATURE=getFiltersSignature();fillFilters();
  document.querySelectorAll('.filterRow select').forEach(s=>s.addEventListener('change',()=>{clearTimeout(renderTimer);renderTimer=setTimeout(render,120)}));
  document.documentElement.style.visibility='visible';
  initLanguage();render();
  let localizationPending=false;
  const observer=new MutationObserver(()=>{if(localizationPending)return;localizationPending=true;queueMicrotask(()=>{localizationPending=false;localize()})});
  observer.observe(document.querySelector('main')||document.body,{subtree:true,childList:true});
 }catch(err){console.error('Initialization:',err.message);safeError(err.message==='ACCESS_DENIED'?'Access denied':err.message==='LOGIN_UID_NOT_AVAILABLE'?'Login credentials incomplete':'Connection unavailable. Please try again.');}
})();

/* ================= FILTERS FILL ================= */
function fillFilters(){
  if(!window.branch) return;

  const b = branch.value;
  const s = section.value;
  const t = trainer.value;
  const c = course.value;
  const p = period.value;
  const d = date.value;

  const branchOptions = ['<option value="">Branch</option>'];
  const trainerOptions = ['<option value="">Trainer</option>'];
  const courseOptions = ['<option value="">Course</option>'];
  const periodOptions = ['<option value="">Period</option>'];
  const dateOptions = ['<option value="">Start Date</option>'];

  uniq(COURSES.map(x=>x.Branch)).forEach(v=>{
    branchOptions.push(`<option value="${safeStr(v)}">${safeStr(v)}</option>`);
  });

  uniq(COURSES.map(x=>x.Trainer)).forEach(v=>{
    trainerOptions.push(`<option value="${safeStr(v)}">${safeStr(v)}</option>`);
  });

  uniq(COURSES.map(x=>x.TrainingCourse)).forEach(v=>{
    courseOptions.push(`<option value="${safeStr(v)}">${safeStr(v)}</option>`);
  });

  uniq(COURSES.map(x=>x.Period)).forEach(v=>{
    periodOptions.push(`<option value="${safeStr(v)}">${safeStr(v)}</option>`);
  });

  /* ===== فلتر التاريخ مع تمييز آخر 5 ===== */
  DATE_CACHE = uniq(COURSES.map(x=>formatDate(x.StartingDate)));

  const sortedDates = DATE_CACHE
    .map(val => ({
      text: val,
      value: new Date(val).getTime()
    }))
    .filter(item => item.text !== "-" && !isNaN(item.value))
    .sort((a,b)=>b.value - a.value);

  const latest5 = sortedDates.slice(0,5).map(item=>item.text);

  sortedDates.forEach(item=>{
    const isRecent = latest5.includes(item.text);

    dateOptions.push(`
      <option value="${item.text}" style="${isRecent ? 'color:#27ae60;font-weight:900;' : ''}">
        ${isRecent ? '□ ' : ''}${item.text}
      </option>
    `);
  });

  branch.innerHTML = branchOptions.join("");
  trainer.innerHTML = trainerOptions.join("");
  course.innerHTML = courseOptions.join("");
  period.innerHTML = periodOptions.join("");
  date.innerHTML = dateOptions.join("");

  branch.value = b;
  section.value = s;
  trainer.value = t;
  course.value = c;
  period.value = p;
  date.value = d;
}

function resetFilters(){
  branch.value="";
  section.value="";
  trainer.value="";

/* ================= SORT ================= */
function sortTable(key){

  if(SORT.key === key){
    SORT.dir *= -1;
  }else{
    SORT.key = key;
    SORT.dir = 1;
  }

  document.querySelectorAll("th i").forEach(i=>{
    i.className = "";
  });

  const icon = document.getElementById("s-" + key);
  if(icon){
    icon.className = iconFor(SORT.dir);
  }

  // ✅ إذا زر Active Courses شغال
  if(ACTIVE_MODE === true){

    FILTERED = applySort(FILTERED);

    renderActiveCourses();

    return;
  }

  // ✅ الوضع الطبيعي مع الفلاتر
  render();

}
function applySort(list){
  if(!SORT.key) return list;

  const key = SORT.key;
  const dir = SORT.dir;

  return list.slice().sort((a,b)=>{
    let x, y;

    if(key === "students"){
      x = STUDENT_COUNT[a.id] || 0;
      y = STUDENT_COUNT[b.id] || 0;
      return (x>y ? dir : x<y ? -dir : 0);
    }

    x = a[key];
    y = b[key];

    if(key === "StartingDate" || key === "EndingDate"){
      const xs = (x && x.seconds) ? x.seconds : (x ? new Date(x).getTime()/1000 : 0);
      const ys = (y && y.seconds) ? y.seconds : (y ? new Date(y).getTime()/1000 : 0);
      return (xs>ys ? dir : xs<ys ? -dir : 0);
    }

    const xv = normalizeSortVal(x);
    const yv = normalizeSortVal(y);
    return (xv>yv ? dir : xv<yv ? -dir : 0);
  });
}

function updateSummary(grandTotal, periodKeys){

    return;
  }

  const sections = uniq(FILTERED.map(c=>safeStr(c.Section)));

  const ends     = uniq(FILTERED.map(c=>formatDate(c.EndingDate)).filter(v=>v!=="-"));

  const branchTxt = branch.value || (branches.length ? branches.join(", ") : "All");
  const sectionTxt = section.value || (sections.length ? sections.join(", ") : "All");

  let startTxt = "Multiple";
  let endTxt = "Multiple";

  if(date.value){
    startTxt = date.value;
  }else if(starts.length===1){
    startTxt = starts[0];
  }else if(starts.length===0){
    startTxt = "-";
  }

  if(ends.length===1){
    endTxt = ends[0];
  }else if(ends.length===0){
    endTxt = "-";

  summaryContent.innerHTML = `
    <div>□ Branch: ${branchTxt}</div>

function getLatest5Dates(list){
  const dates = list
    .map(c => {
      if(!c.StartingDate) return null;
      if(c.StartingDate.seconds) return c.StartingDate.seconds;
      const t = new Date(c.StartingDate).getTime();
      return isNaN(t) ? null : (t / 1000);
    })
    .filter(v => v !== null)
    .sort((a,b) => b - a);

  return dates.slice(0,5);
}
